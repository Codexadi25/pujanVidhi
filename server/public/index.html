<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoojanVidhi Server Control Center | Backend Admin & Telemetry Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="icon" type="image/jpeg" href="/images/PoojanVidhi_Logo.jpeg">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('poojanvidhi_admin_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- AUTH SCREEN (Rendered by AuthPageView) -->
  <div id="auth-screen-container"></div>

  <!-- Top Header Telemetry Strip (Rendered by TopbarView) -->
  <div id="topbar-container"></div>

  <!-- Navigation Tabs Strip (Rendered by NavView) -->
  <div id="nav-container"></div>

  <!-- Tab Panes Container (Rendered by Page Views) -->
  <main class="main-content" id="pages-container"></main>

  <!-- MODALS CONTAINER (Rendered by ModalsView) -->
  <div id="modals-container"></div>

  <!-- Modular MVC Application Bootstrap -->
  <script type="module" src="/js/admin.js?v=2.7"></script>
</body>
</html>
