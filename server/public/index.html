<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poojan Vidhi - Administration Portal</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 440px;
      margin: 60px auto;
      padding: 0 20px;
      color: #38231b;
      background: #fbf7f0;
    }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #e7d5c2;
      box-shadow: 0 8px 30px rgba(53, 18, 14, 0.08);
      text-align: center;
    }
    h2 { color: #8f211c; margin-top: 0; }
    p { color: #6d5345; font-size: 14px; line-height: 1.6; }
    .btn-mui {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 16px 0 10px;
      background: #8f211c;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid #c69a43;
      transition: 0.2s;
    }
    .btn-mui:hover { background: #6f1511; }
    .badge {
      display: inline-block;
      background: #fff2db;
      color: #8c2e17;
      border: 1px solid #e4bd70;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">MVC SERVER VIEW MODULE</span>
    <h2>Poojan Vidhi Admin</h2>
    <p>Manage products, pricing, features, view registered user details, and monitor live orders with the Material UI React Control Center.</p>
    <a href="http://localhost:5173/#admin" class="btn-mui">
      Launch Material UI Admin Control Center →
    </a>
    <p style="font-size: 12px; color: #a48572; margin-top: 15px;">
      Passkey: <code>admin123</code> (configured in <code>.env</code>)
    </p>
  </div>
</body>
</html>
